name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clause
          POSTGRES_PASSWORD: clause
          POSTGRES_DB: clause
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clause -d clause"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clause:clause@127.0.0.1:5432/clause_test
      PGPASSWORD: clause

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: api
        run: uv sync

      - name: Create test database + enable pgvector
        run: |
          psql -h 127.0.0.1 -U clause -d clause -c "ALTER ROLE clause CREATEDB;" || true
          psql -h 127.0.0.1 -U clause -d clause -c "CREATE DATABASE clause_test OWNER clause;"
          psql -h 127.0.0.1 -U clause -d clause_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        working-directory: api
        run: uv run ruff check .

      - name: Pytest
        working-directory: api
        run: uv run pytest

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (typechecks too)
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
