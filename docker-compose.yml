# Local Postgres + pgvector for Clause.
# `docker compose up -d` brings up the database the API expects.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clause-db
    environment:
      POSTGRES_USER: clause
      POSTGRES_PASSWORD: clause
      POSTGRES_DB: clause
    ports:
      - "5432:5432"
    volumes:
      - clause_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause -d clause"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clause_pgdata:
